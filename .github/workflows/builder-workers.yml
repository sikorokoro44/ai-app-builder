name: Builder - Workers

# Runs individual agents for a run the coordinator started. Each job downloads the
# run store, runs exactly one agent, and uploads that agent's directory back.
#
# The coordinator is the scheduler of record and parallelises on its own, so this
# workflow is for splitting a long run across machines. An agent whose
# dependencies are not in the store refuses to run and says which ones are missing.
on:
  workflow_dispatch:
    inputs:
      runId:
        description: 'Run to work on (from the coordinator run or its artifact)'
        required: true
        type: string
      agents:
        description: 'Comma-separated agent ids, or a wave number such as 3'
        required: true
        type: string
      coordinatorRunId:
        description: 'Actions run id whose builder-run-state artifact holds the store'
        required: true
        type: string
      mode:
        description: 'full or pre-cloud'
        required: false
        default: 'full'
        type: choice
        options: [full, pre-cloud]

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      # Downloads the coordinator's run store artifact from another run.
      actions: read
    outputs:
      agents: ${{ steps.plan.outputs.agents }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # The store was uploaded by the coordinator's own run; downloading from the
      # current run (the default) would find nothing. run-id + the token are what
      # make this cross-run download real.
      - name: Download the run store
        uses: actions/download-artifact@v8
        with:
          name: builder-run-state-${{ inputs.coordinatorRunId }}
          path: workspace
          run-id: ${{ inputs.coordinatorRunId }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out which agents this invocation covers
        id: plan
        env:
          BUILDER_AGENT_DIR: workspace/.builder/agents
          # Passed through the environment rather than interpolated into the
          # script, so a crafted input cannot become code.
          REQUESTED: ${{ inputs.agents }}
        run: |
          set -euo pipefail
          value="$REQUESTED"
          if [[ "$value" =~ ^[0-9]+$ ]]; then
            value=$(node --experimental-strip-types -e "
              import { executionWaves } from './scripts/agents/registry.ts';
              const wave = executionWaves()[Number(process.env.REQUESTED) - 1];
              if (!wave) { console.error('no wave ' + process.env.REQUESTED); process.exit(1); }
              console.log(wave.join(','));
            ")
          fi
          echo "Running: $value"
          RESOLVED="$value" node --experimental-strip-types -e "
            const list = process.env.RESOLVED.split(/[\\s,]+/).filter(Boolean);
            if (!list.length) { console.error('no agents to run'); process.exit(1); }
            console.log('agents=' + JSON.stringify(list));
          " >> "$GITHUB_OUTPUT"

  worker:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      # Downloads the coordinator's run store artifact from another run.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.prepare.outputs.agents) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # Same cross-run download as prepare: the store lives in the coordinator's
      # run, not this one, so run-id + github-token must be explicit.
      - name: Download the run store
        uses: actions/download-artifact@v8
        with:
          name: builder-run-state-${{ inputs.coordinatorRunId }}
          path: workspace
          run-id: ${{ inputs.coordinatorRunId }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize the downloaded run store
        env:
          BUILDER_RUN_ID: ${{ inputs.runId }}
        run: |
          set -euo pipefail
          # upload-artifact keeps whatever implicit layout each major produced:
          # a single directory path arrives as the directory contents (the run
          # dir next to current-run.json), while a path list arrives as
          # basename roots (agents/, live/, ...). Pull every variant into the
          # fixed .builder/ layout the scripts read from.
          if [ -f workspace/current-run.json ]; then
            mkdir -p workspace/.builder/agents
            [ -d "workspace/$BUILDER_RUN_ID" ] && mv "workspace/$BUILDER_RUN_ID" "workspace/.builder/agents/$BUILDER_RUN_ID"
            mv workspace/current-run.json workspace/.builder/agents/current-run.json
          fi
          for name in agents live requests generated; do
            if [ -d "workspace/$name" ] && [ ! -d "workspace/.builder/$name" ]; then
              mkdir -p workspace/.builder
              mv "workspace/$name" "workspace/.builder/$name"
            fi
          done
          test -f "workspace/.builder/agents/$BUILDER_RUN_ID/manifest.json" \
            || { echo "::error::the run store did not arrive in a readable layout"; exit 1; }
      - name: Use the project the coordinator generated
        run: |
          if [ -d workspace/.builder/generated/android ]; then
            echo "BUILDER_PROJECT_DIR=workspace/.builder/generated/android" >> "$GITHUB_ENV"
          else
            echo "BUILDER_PROJECT_DIR=.builder/generated/android" >> "$GITHUB_ENV"
          fi

      - name: Run ${{ matrix.agent }}
        env:
          BUILDER_CONFIG_PATH: config/builder.json
          BUILDER_AGENT_DIR: workspace/.builder/agents
          BUILDER_STATE_DIR: workspace/.builder/live
          BUILDER_REPO_ROOT: .
          BUILDER_MODE: ${{ inputs.mode }}
          BUILDER_AGENT: ${{ matrix.agent }}
          BUILDER_RUN_ID: ${{ inputs.runId }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # env-bound rather than interpolated: `matrix.agent` comes from the
          # caller-supplied `agents` list, and this job holds contents + issues
          # write and the token, so a crafted value must never reach the shell.
          if [ "$BUILDER_MODE" = "pre-cloud" ]; then
            node --experimental-strip-types scripts/worker.ts --agent "$BUILDER_AGENT" --run "$BUILDER_RUN_ID" --pre-cloud
          else
            node --experimental-strip-types scripts/worker.ts --agent "$BUILDER_AGENT" --run "$BUILDER_RUN_ID"
          fi
      - name: Upload what this agent produced
        uses: actions/upload-artifact@v7
        with:
          name: builder-agent-${{ matrix.agent }}-${{ github.run_id }}
          path: workspace/.builder/agents/${{ inputs.runId }}/${{ matrix.agent }}
          retention-days: 7
          if-no-files-found: warn
