name: Builder - Workers runtime

# Runtime exercise of the hardened builder-workers.yml paths, on every push to
# main. It does not loosen anything: the seeded run store is a *genuine* store
# written by the real startRun/executionWaves code, the worker dispatches run
# the real workflow they would be run by, and the hostile leg proves a crafted
# caller-supplied agent id is refused as data (exit 1, no artifact uploaded)
# instead of becoming a shell command.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    outputs:
      runId: ${{ steps.seed.outputs.runId }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Seed a genuine run store via startRun
        id: seed
        env:
          BUILDER_AGENT_DIR: .builder/agents
          WORKER_IDEA: 'Workout log with sets and reps that I can review later'
        run: |
          set -euo pipefail
          node --experimental-strip-types -e '
            import { startRun } from "./scripts/agents/artifacts.ts";
            import { newRunId } from "./scripts/agents/coordinator.ts";
            import { AGENT_ID_NAMES, executionWaves } from "./scripts/agents/registry.ts";
            const idea = process.env.WORKER_IDEA;
            const runId = newRunId(idea);
            startRun({
              runId,
              idea,
              createdAt: new Date().toISOString(),
              planner: "scripts/agents/planner.ts",
              agents: AGENT_ID_NAMES,
              waves: executionWaves()
            });
          '
          runId=$(node --experimental-strip-types -e '
            import { currentRunId } from "./scripts/agents/artifacts.ts";
            const id = currentRunId();
            if (!id) throw new Error("no run was seeded");
            process.stdout.write(id);
          ')
          echo "Seeded run $runId"
          echo "runId=$runId" >> "$GITHUB_OUTPUT"
      - name: Upload the store this CI run owns
        uses: actions/upload-artifact@v7
        with:
          name: builder-run-state-${{ github.run_id }}
          path: |
            .builder/agents
          retention-days: 7
          if-no-files-found: error

  drive:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Dispatches builder-workers.yml and reads its runs and artifacts.
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SEED_RUN_ID: ${{ needs.seed.outputs.runId }}
      CI_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Run one agent through the real workers workflow
        id: good
        run: |
          set -euo pipefail
          dispatch_and_wait() {
            local agents="$1"
            local expect="$2"
            gh workflow run builder-workers.yml \
              -f runId="$SEED_RUN_ID" \
              -f agents="$agents" \
              -f coordinatorRunId="$CI_RUN_ID" \
              -f mode=pre-cloud
            for i in $(seq 1 60); do
              sleep 5
              newest=$(gh run list --workflow builder-workers.yml --limit 10 \
                --json databaseId,event,headSha,createdAt,status \
                --jq "[.[] | select(.event==\"workflow_dispatch\") | select(.headSha==\"$GITHUB_SHA\") | select(.status==\"completed\") | select((\" $HANDLED \" | contains(\" \" + (.databaseId|tostring) + \" \")) | not)] | sort_by(.createdAt) | .[0].databaseId" || true)
              if [ -n "$newest" ]; then
                conclusion=$(gh run view "$newest" --json conclusion --jq '.conclusion')
                echo "dispatched run $newest (agents='$agents') concluded: $conclusion (expected $expect)"
                HANDLED="$HANDLED $newest"
                if [ "$conclusion" != "$expect" ]; then
                  echo "::error::worker run $newest concluded $conclusion, expected $expect"
                  return 1
                fi
                RUN_ID="$newest"
                return 0
              fi
            done
            echo "::error::no workflow_dispatch run surfaced for sha $GITHUB_SHA (agents='$agents')"
            return 1
          }
          HANDLED=""
          RUN_ID=""
          dispatch_and_wait "1" "success"
          run1="$RUN_ID"
          # The prepared wave-one agent must have run and published its output.
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run1/artifacts" \
            --jq '[.artifacts[].name] | join(",")')
          case ",$artifacts," in
            *,builder-agent-idea-intake-*) ;;
            *) echo "::error::worker run uploaded no builder-agent-idea-intake artifact (got: $artifacts)"; exit 1 ;;
          esac
          gh run download "$run1" -n "builder-agent-idea-intake-$run1" -D "$RUNNER_TEMP/agent"
          base="$RUNNER_TEMP/agent/workspace/.builder/agents/$SEED_RUN_ID/idea-intake"
          for f in idea.json output.json status.json; do
            test -f "$base/$f" || { echo "::error::worker artifact lacks $f"; exit 1; }
          done
          ST=$(STATE_FILE="$base/status.json" node --experimental-strip-types -e '
            const fs = await import("node:fs");
            const rec = JSON.parse(fs.readFileSync(process.env.STATE_FILE, "utf-8"));
            process.stdout.write(String(rec.status));
          ')
          echo "idea-intake status: $ST"
          test "$ST" = "completed" || { echo "::error::idea-intake did not complete"; exit 1; }
          idea=$(STATE_FILE="$base/idea.json" node --experimental-strip-types -e '
            const fs = await import("node:fs");
            const rec = JSON.parse(fs.readFileSync(process.env.STATE_FILE, "utf-8"));
            process.stdout.write(String(rec.normalized));
          ')
          echo "normalized idea: $idea"
          case "$idea" in
            Workout\ log*) ;;
            *) echo "::error::worker ran against a different idea"; exit 1 ;;
          esac
          echo "runId=$run1" >> "$GITHUB_OUTPUT"

      - name: Prove a hostile agent id is refused as data, not executed
        env:
          GOOD_RUN_ID: ${{ steps.good.outputs.runId }}
        run: |
          set -euo pipefail
          dispatch_and_wait() {
            local agents="$1"
            local expect="$2"
            gh workflow run builder-workers.yml \
              -f runId="$SEED_RUN_ID" \
              -f agents="$agents" \
              -f coordinatorRunId="$CI_RUN_ID" \
              -f mode=pre-cloud
            for i in $(seq 1 60); do
              sleep 5
              newest=$(gh run list --workflow builder-workers.yml --limit 10 \
                --json databaseId,event,headSha,createdAt,status \
                --jq "[.[] | select(.event==\"workflow_dispatch\") | select(.headSha==\"$GITHUB_SHA\") | select(.status==\"completed\") | select((\" $HANDLED \" | contains(\" \" + (.databaseId|tostring) + \" \")) | not)] | sort_by(.createdAt) | .[0].databaseId" || true)
              if [ -n "$newest" ]; then
                conclusion=$(gh run view "$newest" --json conclusion --jq '.conclusion')
                echo "dispatched run $newest (agents='$agents') concluded: $conclusion (expected $expect)"
                HANDLED="$HANDLED $newest"
                if [ "$conclusion" != "$expect" ]; then
                  echo "::error::worker run $newest concluded $conclusion, expected $expect"
                  return 1
                fi
                RUN_ID="$newest"
                return 0
              fi
            done
            echo "::error::no workflow_dispatch run surfaced for sha $GITHUB_SHA (agents='$agents')"
            return 1
          }
          HANDLED="$GOOD_RUN_ID"
          # Exactly what a hostile caller could put in the `agents` input: shell
          # metacharacters plus a marker side effect, none of which may execute.
          hostile='idea-intake;echo pwned > agent-pwned.txt'
          RUN_ID=""
          dispatch_and_wait "$hostile" "failure"
          run2="$RUN_ID"
          # The refusal must have shipped nothing: if a shell had executed the
          # value, the worker would have uploaded artifacts or written a side
          # effect alongside the refused id.
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run2/artifacts" --jq '.artifacts | length')
          echo "hostile run artifacts: $count"
          test "$count" = "0" || { echo "::error::the hostile run uploaded artifacts"; exit 1; }
          logs=$(gh run view "$run2" --log 2>/dev/null || true)
          echo "$logs" | grep -q "Unknown agent" || { echo "::error::worker did not refuse the hostile agent"; exit 1; }
          echo "$logs" | grep -q "agent-pwned.txt" || { echo "::error::refusal did not name the entire hostile token"; exit 1; }
          echo "hostile agent id handled as data"