name: Builder - Workers runtime

# Runtime exercise of the hardened builder-workers.yml paths, on every push to
# main. It does not loosen anything: the seeded run store is a *genuine* store
# written by the real startRun/executionWaves code, the worker dispatches run
# the real workflow they would be run by, and the hostile leg proves a crafted
# caller-supplied agent id is refused as data (exit 1, no artifact uploaded)
# instead of becoming a shell command.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    outputs:
      runId: ${{ steps.seed.outputs.runId }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Seed a genuine run store via startRun
        id: seed
        env:
          BUILDER_AGENT_DIR: .builder/agents
          WORKER_IDEA: 'Workout log with sets and reps that I can review later'
        run: |
          set -euo pipefail
          node --experimental-strip-types -e '
            import { startRun } from "./scripts/agents/artifacts.ts";
            import { newRunId } from "./scripts/agents/coordinator.ts";
            import { AGENT_ID_NAMES, executionWaves } from "./scripts/agents/registry.ts";
            import { readState, writeState } from "./scripts/live/stateStore.ts";
            import { createInitialState } from "./shared/state.ts";
            const idea = process.env.WORKER_IDEA;
            const runId = newRunId(idea);
            startRun({
              runId,
              idea,
              createdAt: new Date().toISOString(),
              planner: "scripts/agents/planner.ts",
              agents: AGENT_ID_NAMES,
              waves: executionWaves()
            });
            // This CI run checks out `main`, which carries the live state of
            // whatever ran last (COMPLETED). Faithfully mimic startNewRun: the
            // run is abandoned and replaced with a fresh NOT_STARTED state, so
            // the dispatched worker sees exactly the disk a real awakening run
            // sees.
            const previous = readState();
            const fresh = createInitialState();
            fresh.latestActivity = `abandoned the run that was at ${previous.projectState} to start "${idea}" from nothing`;
            writeState(fresh, { allowUncheckedTransition: true, reason: `restarting "${idea}" from ${previous.projectState}` });
          '
          runId=$(node --experimental-strip-types -e '
            import { currentRunId } from "./scripts/agents/artifacts.ts";
            const id = currentRunId();
            if (!id) throw new Error("no run was seeded");
            process.stdout.write(id);
          ')
          echo "Seeded run $runId"
          echo "runId=$runId" >> "$GITHUB_OUTPUT"
      - name: Upload the store this CI run owns
        uses: actions/upload-artifact@v7
        with:
          name: builder-run-state-${{ github.run_id }}
          path: |
            .builder/agents
            .builder/live
            .builder/requests
            .builder/generated/android
          retention-days: 7
          if-no-files-found: warn

  drive:
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Dispatches builder-workers.yml and reads its runs and artifacts.
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      SEED_RUN_ID: ${{ needs.seed.outputs.runId }}
      CI_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Run one agent through the real workers workflow
        id: good
        run: |
          set -euo pipefail
          dispatch_and_wait() {
            local agents="$1"
            local expect="$2"
            local rid=""
            local known
            known=$(gh run list --workflow builder-workers.yml --limit 10 \
              --json databaseId,event,headSha --jq \
              '.[] | select(.event=="workflow_dispatch") | select(.headSha=="'"$GITHUB_SHA"'") | .databaseId' | sort -u)
            gh workflow run builder-workers.yml \
              -f runId="$SEED_RUN_ID" \
              -f agents="$agents" \
              -f coordinatorRunId="$CI_RUN_ID" \
              -f mode=pre-cloud
            for i in $(seq 1 60); do
              sleep 5
              # the freshly dispatched run is the one whose id was not there
              # before the dispatch; wait for it to exist, then to complete
              now=$(gh run list --workflow builder-workers.yml --limit 10 \
                --json databaseId,event,headSha --jq \
                '.[] | select(.event=="workflow_dispatch") | select(.headSha=="'"$GITHUB_SHA"'") | .databaseId' | sort -u)
              rid=$(comm -13 <(printf '%s\n' "$known") <(printf '%s\n' "$now") | tail -1)
              [ -n "$rid" ] || continue
              st=$(gh run view "$rid" --json status --jq '.status')
              [ "$st" = "completed" ] && break
              rid=""
            done
            if [ -z "$rid" ]; then
              echo "::error::no workflow_dispatch run surfaced for sha $GITHUB_SHA (agents='$agents')"
              return 1
            fi
            conclusion=$(gh run view "$rid" --json conclusion --jq '.conclusion')
            echo "dispatched run $rid (agents='$agents') concluded: $conclusion (expected $expect)"
            if [ "$conclusion" != "$expect" ]; then
              echo "::error::worker run $rid concluded $conclusion, expected $expect"
              return 1
            fi
            RUN_ID="$rid"
            return 0
          }
          RUN_ID=""
          dispatch_and_wait "1" "success"
          run1="$RUN_ID"
          # The prepared wave-one agent must have run and published its output.
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run1/artifacts" \
            --jq '[.artifacts[].name] | join(",")')
          case ",$artifacts," in
            *,builder-agent-idea-intake-*) ;;
            *) echo "::error::worker run uploaded no builder-agent-idea-intake artifact (got: $artifacts)"; exit 1 ;;
          esac
          gh run download "$run1" -n "builder-agent-idea-intake-$run1" -D "$RUNNER_TEMP/agent"
          # upload-artifact lands a directory's contents at the artifact root,
          # so find the published files rather than assume a nested path.
          # find -print -quit terminates itself, so no pipe goes stale under
          # pipefail (echo|grep -q and echo|head close the pipe early).
          for f in idea.json output.json status.json; do
            [ -n "$(find "$RUNNER_TEMP/agent" -type f -name "$f" -print -quit)" ] \
              || { echo "::error::worker artifact lacks $f"; exit 1; }
          done
          status_file=$(find "$RUNNER_TEMP/agent" -type f -name status.json -print -quit)
          idea_file=$(find "$RUNNER_TEMP/agent" -type f -name idea.json -print -quit)
          ST=$(STATE_FILE="$status_file" node --experimental-strip-types -e '
            const fs = await import("node:fs");
            const rec = JSON.parse(fs.readFileSync(process.env.STATE_FILE, "utf-8"));
            process.stdout.write(String(rec.status));
          ')
          echo "idea-intake status: $ST"
          test "$ST" = "completed" || { echo "::error::idea-intake did not complete"; exit 1; }
          idea=$(STATE_FILE="$idea_file" node --experimental-strip-types -e '
            const fs = await import("node:fs");
            const rec = JSON.parse(fs.readFileSync(process.env.STATE_FILE, "utf-8"));
            process.stdout.write(String(rec.normalized));
          ')
          echo "normalized idea: $idea"
          case "$idea" in
            Workout\ log*) ;;
            *) echo "::error::worker ran against a different idea"; exit 1 ;;
          esac
          echo "runId=$run1" >> "$GITHUB_OUTPUT"

      - name: Prove a hostile agent id is refused as data, not executed
        run: |
          set -euo pipefail
          dispatch_and_wait() {
            local agents="$1"
            local expect="$2"
            local rid=""
            local known
            known=$(gh run list --workflow builder-workers.yml --limit 10 \
              --json databaseId,event,headSha --jq \
              '.[] | select(.event=="workflow_dispatch") | select(.headSha=="'"$GITHUB_SHA"'") | .databaseId' | sort -u)
            gh workflow run builder-workers.yml \
              -f runId="$SEED_RUN_ID" \
              -f agents="$agents" \
              -f coordinatorRunId="$CI_RUN_ID" \
              -f mode=pre-cloud
            for i in $(seq 1 60); do
              sleep 5
              # the freshly dispatched run is the one whose id was not there
              # before the dispatch; wait for it to exist, then to complete
              now=$(gh run list --workflow builder-workers.yml --limit 10 \
                --json databaseId,event,headSha --jq \
                '.[] | select(.event=="workflow_dispatch") | select(.headSha=="'"$GITHUB_SHA"'") | .databaseId' | sort -u)
              rid=$(comm -13 <(printf '%s\n' "$known") <(printf '%s\n' "$now") | tail -1)
              [ -n "$rid" ] || continue
              st=$(gh run view "$rid" --json status --jq '.status')
              [ "$st" = "completed" ] && break
              rid=""
            done
            if [ -z "$rid" ]; then
              echo "::error::no workflow_dispatch run surfaced for sha $GITHUB_SHA (agents='$agents')"
              return 1
            fi
            conclusion=$(gh run view "$rid" --json conclusion --jq '.conclusion')
            echo "dispatched run $rid (agents='$agents') concluded: $conclusion (expected $expect)"
            if [ "$conclusion" != "$expect" ]; then
              echo "::error::worker run $rid concluded $conclusion, expected $expect"
              return 1
            fi
            RUN_ID="$rid"
            return 0
          }
          # Exactly what a hostile caller could put in the `agents` input: shell
          # metacharacters plus a marker side effect, none of which may execute.
          hostile='idea-intake;echo pwned > agent-pwned.txt'
          RUN_ID=""
          dispatch_and_wait "$hostile" "failure"
          run2="$RUN_ID"
          # The refusal must have shipped nothing: if a shell had executed the
          # value, the worker would have uploaded artifacts or written a side
          # effect alongside the refused id.
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run2/artifacts" --jq '.artifacts | length')
          echo "hostile run artifacts: $count"
          test "$count" = "0" || { echo "::error::the hostile run uploaded artifacts"; exit 1; }
          # grep -q down a pipe makes echo hit SIGPIPE as soon as the first line
          # matches, which pipefail reports as failure; grep files instead.
          gh run view "$run2" --log > "$RUNNER_TEMP/hostile.log"
          grep -q "Unknown agent" "$RUNNER_TEMP/hostile.log" \
            || { echo "::error::worker did not refuse the hostile agent"; exit 1; }
          grep -q "agent-pwned.txt" "$RUNNER_TEMP/hostile.log" \
            || { echo "::error::refusal did not name the entire hostile token"; exit 1; }
          echo "hostile agent id handled as data"