name: Builder - Coordinator

# Runs the twenty agents for one idea. The run store (.builder/agents) is cached
# and uploaded, so a stopped run is continued with `--resume <runId>` instead of
# being started again.
on:
  workflow_dispatch:
    inputs:
      idea:
        description: 'Plain-text idea to build'
        required: true
        type: string
      runId:
        description: 'Continue this run instead of starting a new one'
        required: false
        type: string
      concurrency:
        description: 'Agents to run at once'
        required: false
        default: '4'
        type: string
      mode:
        description: 'full runs GitHub publishing and the cloud build; pre-cloud stops after validation'
        required: false
        default: 'full'
        type: choice
        options: [full, pre-cloud]

concurrency:
  group: builder-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    # The fleet plus a cloud build that is polled for up to BUILDER_POLL_TIMEOUT_MS
    # plus release and public-download verification. Sixty minutes was not enough
    # headroom for a slow Gradle build followed by a retry, and a job killed by its
    # own timeout leaves the run needing a resume.
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # The coordinator dispatches builder-android-build.yml with this job's own
      # GITHUB_TOKEN. The repository's default workflow permission is `read`, so
      # without this the dispatch is refused with HTTP 403 "Resource not
      # accessible by integration" (run 37380932123) and the fleet fails after
      # the app is already pushed, with nothing built and nothing to say so.
      actions: write
    steps:
      # `repo-publisher` refuses to push from a detached HEAD, and githubPush.ts
      # compares origin/main with HEAD, so the branch and its history are needed.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # `actions/checkout` configures credentials but no author identity, so
      # every commit made in this job exits 128 with "Author identity unknown"
      # until something sets one. repo-publisher commits the generated app as
      # its first act, which is where run 37379495902 died. The script also
      # checks for itself; this keeps the identity available to every step in
      # the job rather than to one that happens to run first.
      - name: Give the job an identity to commit with
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config --get user.email

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The run store has to survive from one run of this workflow to the next,
      # whichever way the previous one was stopped: a platform outage that never
      # started it, a cancelled job, or a coordinator that died mid-build. Keying
      # the cache on github.run_id gave every dispatch an empty store, so
      # `--resume` had nothing to resume and a stopped run silently started over.
      # The key is the commit, and the restore prefix reaches back through it, so
      # an interrupted run is picked up from the store the last attempt left.
      - name: Restore the run store
        uses: actions/cache@v4
        with:
          path: |
            .builder/agents
            .builder/live
          key: builder-run-store-${{ github.sha }}
          restore-keys: |
            builder-run-store-

      - name: Show the runs already on disk
        run: node --experimental-strip-types scripts/coordinator.ts --runs || true

      - name: Run the fleet
        env:
          BUILDER_IDEA: ${{ inputs.idea }}
          BUILDER_RUN_ID: ${{ inputs.runId }}
          BUILDER_MODE: ${{ inputs.mode }}
          BUILDER_CONCURRENCY: ${{ inputs.concurrency || '4' }}
          BUILDER_CONFIG_PATH: config/builder.json
          BUILDER_AGENT_DIR: .builder/agents
          BUILDER_PROJECT_DIR: .builder/generated/android
          BUILDER_REPO_ROOT: .
          BUILDER_REQUESTS_DIR: .builder/requests
          # A build that GitHub queues for longer than this is treated as
          # abandoned by the platform and re-dispatched rather than waited on.
          BUILDER_POLL_TIMEOUT_MS: '2700000'
          BUILDER_RETRY_BACKOFF_MS: '60000'
          BUILDER_MAX_ATTEMPTS: '3'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Inputs are passed through the environment, never interpolated into
          # the shell: a crafted idea/runId value must not become code in a job
          # that holds contents + issues + pull-requests write and the token.
          args=(--concurrency "$BUILDER_CONCURRENCY")
          if [ "$BUILDER_MODE" = "pre-cloud" ]; then
            args+=(--pre-cloud)
          fi
          if [ -n "$BUILDER_RUN_ID" ]; then
            node --experimental-strip-types scripts/coordinator.ts --resume "$BUILDER_RUN_ID" "${args[@]}"
          else
            node --experimental-strip-types scripts/coordinator.ts "$BUILDER_IDEA" "${args[@]}"
          fi

      - name: Report what the run proved
        if: always()
        run: node --experimental-strip-types scripts/coordinator.ts --status || true

      # GitHub is the permanent source of truth, so the evidence this run produced
      # belongs in the repository and not only in an artifact that expires. Only
      # the live state is committed: the generated sources are owned by
      # repo-publisher, and the run store is a scratch directory.
      - name: Publish the live state to the authoritative branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .builder/live
          if git diff --cached --quiet; then
            echo "The live state did not change."
            exit 0
          fi
          git commit -m "builder: live state after run ${{ github.run_id }}" || echo "nothing to commit"
          # Push our final state, rebasing over any remote changes that don't conflict
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git pull --rebase --autostash origin main || true
            # If rebase brought in conflicts with our committed state, try to keep our version
            git checkout --ours .builder/live 2>/dev/null || true
            git add .builder/live 2>/dev/null || true
            git rebase --continue 2>/dev/null || true
          done
          echo '::error::Could not publish the live state after three attempts.'
          exit 1

      - name: Upload the run store and live state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: builder-run-state-${{ github.run_id }}
          path: |
            .builder/agents
            .builder/live
            .builder/requests
            .builder/generated/android
          retention-days: 14
          if-no-files-found: warn
