name: Builder - Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      idea:
        description: 'App idea'
        required: true
        type: string
      head_sha:
        description: 'Commit that must be built (optional pin)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # One build per commit. A second dispatch for the same commit queues behind the
  # first instead of racing it, which is what keeps duplicate artifacts from
  # appearing for identical input.
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      package_id: ${{ steps.identity.outputs.package_id }}
      apk_sha256: ${{ steps.identity.outputs.apk_sha256 }}
      apk_size: ${{ steps.identity.outputs.apk_size }}
      head_sha: ${{ steps.identity.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The generated `gradlew` is a thin shim that execs a system `gradle`
      # (there is no wrapper jar in the tree), so Gradle has to be provisioned
      # here. The version must match the distributionUrl the generator pins in
      # gradle/wrapper/gradle-wrapper.properties; test/hardeningRegression.test.ts
      # fails if the two drift apart.
      - name: Set up Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.0 platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify the workflow ran for the commit that was requested
        id: commit
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.head_sha }}" ] && [ "${{ inputs.head_sha }}" != "$head" ]; then
            echo "::error::This run built $head but ${{ inputs.head_sha }} was requested."
            exit 1
          fi

      - name: Generate the Android project from the idea
        env:
          BUILDER_IDEA: ${{ inputs.idea }}
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/generateAndroidApp.ts

      - name: Validate the generated project before building
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/cloudBuildExecute.ts --prepare

      - name: Run the JVM unit tests for the generated data layer
        working-directory: .builder/generated/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble the debug APK
        working-directory: .builder/generated/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Record the APK identity and checksum
        id: identity
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.head_sha }}
        run: |
          set -euo pipefail
          root=.builder/generated/android
          # Search the whole generated project rather than one hardcoded path, so
          # a change in where AGP writes outputs cannot silently turn into "no
          # APK". Intermediates hold unpacked classes, not a packageable APK.
          apk="$(find "$root/app/build/outputs" -name '*.apk' 2>/dev/null | sort | head -n 1 || true)"
          if [ -z "$apk" ]; then
            echo "::error::assembleDebug reported success but produced no APK"
            echo "--- APK-shaped directories under $root ---"
            find "$root" -type d -name 'apk*' 2>/dev/null | head -20 || true
            echo "--- any .apk anywhere under $root ---"
            find "$root" -name '*.apk' 2>/dev/null | head -20 || true
            echo "--- app/build tree (depth 3) ---"
            find "$root/app/build" -maxdepth 3 -type d 2>/dev/null | head -40 || true
            exit 1
          fi
          echo "found APK at $apk"
          sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          size="$(stat -c %s "$apk")"
          # requirePackageId: this step exists to record the artifact identity.
          # Without it an APK whose package id cannot be read is reported valid,
          # and the recorded package_id is silently empty while the run passes.
          pkg="$(APK_FILE="$apk" node --experimental-strip-types -e "
            import { verifyApkFile } from './scripts/live/apkValidator.ts';
            const res = verifyApkFile(process.env.APK_FILE, undefined, { requirePackageId: true });
            if (!res.valid) { console.error(res.errors.join('\n')); process.exit(1); }
            process.stdout.write(res.packageId || '');
          ")"
          if [ -z "$pkg" ]; then
            echo "::error::APK verification reported success but produced no package id"
            exit 1
          fi
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "apk_size=$size" >> "$GITHUB_OUTPUT"
          echo "package_id=$pkg" >> "$GITHUB_OUTPUT"
          echo "head_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      # The Node verifier proves the icon from the artifact, but it deliberately
      # does not resolve a resource id to its exact resources.arsc entry, because
      # a wrong guess there produces confident but false evidence. aapt2 is the
      # tool that wrote that table, so it settles the binding authoritatively and
      # the two checks have to agree.
      - name: Verify the compiled launcher icon with aapt2
        env:
          APK_FILE: ${{ steps.identity.outputs.apk_path }}
          ANDROID_HOME: ${{ env.ANDROID_HOME || '' }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT || '' }}
        run: |
          set -euo pipefail
          if ! command -v aapt2 >/dev/null 2>&1; then
            # Try common locations
            for p in "${ANDROID_HOME}/build-tools/*/aapt2" "${ANDROID_HOME}/build-tools/*/*/aapt2" "${ANDROID_SDK_ROOT}/build-tools/*/aapt2" "${ANDROID_SDK_ROOT}/build-tools/*/*/aapt2" /usr/local/lib/android/sdk/build-tools/*/aapt2 /usr/local/lib/android/sdk/build-tools/*/*/aapt2 "${ANDROID_HOME}/cmdline-tools/*/bin/aapt2" "${ANDROID_HOME}/cmdline-tools/latest/bin/aapt2" "${ANDROID_SDK_ROOT}/cmdline-tools/*/bin/aapt2" "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/aapt2"; do
              if [ -x "$p" ]; then
                export AAPT2="$p"
                break
              fi
            done
          fi
          if [ -z "${AAPT2:-}" ] && ! command -v aapt2 >/dev/null 2>&1; then
            echo "::error::aapt2 is unavailable, so the compiled launcher icon cannot be verified"
            echo "Checked PATH and build-tools"
            find /usr/local/lib/android -name "aapt2" 2>/dev/null | head -10
            ls "${ANDROID_HOME}/build-tools" 2>/dev/null | head -5
            find "${ANDROID_HOME}/cmdline-tools" -name "aapt2" 2>/dev/null | head -5
            exit 1
          fi
          node --experimental-strip-types scripts/verifyApkIconAapt.ts "$APK_FILE"

      # Same check, but from the project side: the compiled pixels must match the
      # PNGs this repo generated for this idea, not merely *some* icon.
      - name: Verify the compiled launcher icon against the generated source
        env:
          APK_FILE: ${{ steps.identity.outputs.apk_path }}
        run: |
          set -euo pipefail
          APK_FILE="$APK_FILE" node --experimental-strip-types -e "
            import { verifyApkLauncherIcon } from './scripts/live/apkIconVerifier.ts';
            import {
              validateLauncherIcon, sourceIconSignatures, sourceRoundSignatures,
              sourceForegroundSignatures, sourceIconPngBytes
            } from './scripts/live/launcherIcon.ts';
            const root = '.builder/generated/android';
            const source = validateLauncherIcon(root);
            if (!source.valid) { console.error(source.errors.join('\n')); process.exit(1); }
            const res = verifyApkLauncherIcon(process.env.APK_FILE, {
              signatures: sourceIconSignatures(root),
              roundSignatures: sourceRoundSignatures(root),
              foregroundSignatures: sourceForegroundSignatures(root),
              sourcePngBytes: sourceIconPngBytes(root),
              fingerprint: source.fingerprint
            });
            if (!res.valid) { console.error(res.errors.join('\n')); process.exit(1); }
            console.log("verified " + res.matchedDensities.length + " densities, similarity " + res.similarity);
          ");

      - name: Record the artifact summary
        env:
          APK_PATH: ${{ steps.identity.outputs.apk_path }}
          APK_SHA: ${{ steps.identity.outputs.apk_sha256 }}
          APK_SIZE: ${{ steps.identity.outputs.apk_size }}
          APK_PKG: ${{ steps.identity.outputs.package_id }}
          COMMIT_SHA: ${{ steps.commit.outputs.head_sha }}
        run: |
          set -euo pipefail
          {
            echo "### Android build artifact"
            echo ""
            echo "- package: \`$APK_PKG\`"
            echo "- sha256: \`$APK_SHA\`"
            echo "- bytes: \`$APK_SIZE\`"
            echo "- commit: \`$COMMIT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verified APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.identity.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            .builder/generated/android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
