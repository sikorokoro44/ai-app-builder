name: Builder - CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Configure git identity for push-race tests
        run: git config --global user.email "builder-ci@users.noreply.github.com" && git config --global user.name "builder-ci"
      - name: Full repository test suite
        run: npm test
      - name: State validation
        run: npm run validate
      - name: Repository validation
        run: node --experimental-strip-types scripts/ci/repoValidation.ts
